[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "imc"
version = "0.1.0"
description = "Utilidades para los notebooks de Introducción al Modelado Continuo (LCD, FCEN-UBA)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Julián Fernández Bonder", email = "jfbonder@dm.uba.ar"}]
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
# lo que usan los notebooks y laboratorios además de imc: pip install -e ".[notebooks]"
notebooks = ["pandas", "scikit-image"]
# para regenerar y ejecutar los notebooks con tools/make_*.py: pip install -e ".[notebooks,dev]"
dev = ["nbformat", "nbconvert", "ipykernel"]

[tool.setuptools]
packages = ["imc"]
